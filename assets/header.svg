<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Utsav Savani - Flutter and AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02243f"/>
      <stop offset="50%" stop-color="#02569B"/>
      <stop offset="100%" stop-color="#4A2C8F"/>
      <animate attributeName="x1" values="0%;60%;0%" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;140%;100%" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#13B9FD" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C4DFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#13B9FD" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#13B9FD" stop-opacity="0"/>
      <stop offset="50%" stop-color="#13B9FD" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="220" fill="url(#bg)"/>

  <g opacity="0.9">
    <circle cx="120" cy="52" r="2.5" fill="#13B9FD" opacity="0.7">
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="70" r="2" fill="#7C4DFF" opacity="0.6">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="40" r="1.8" fill="#ffffff" opacity="0.35">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="176" r="2" fill="#13B9FD" opacity="0.5">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g>
    <path fill="url(#wave1)" d="M0,168 C125,132 250,204 375,168 C500,132 625,204 750,168 C875,132 1000,204 1125,168 L1125,220 L0,220 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0; -375 0; 0 0" dur="14s" repeatCount="indefinite"/>
    </path>
    <path fill="url(#wave2)" d="M0,186 C125,158 250,214 375,186 C500,158 625,214 750,186 C875,158 1000,214 1125,186 L1125,220 L0,220 Z">
      <animateTransform attributeName="transform" type="translate" values="-375 0; 0 0; -375 0" dur="18s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="500" y="96" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="58" font-weight="700" fill="#ffffff" letter-spacing="1">Utsav Savani</text>

  <rect x="360" y="118" width="280" height="2" fill="url(#rule)"/>

  <text x="500" y="152" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#B9E6FF" letter-spacing="3.5">FLUTTER &#38; AI ENGINEER</text>

  <text x="500" y="180" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#8FB8D6" letter-spacing="1.6">generative AI inside production apps</text>
</svg>
